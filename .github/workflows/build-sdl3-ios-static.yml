
name: build-sdl3-ios-static

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        platform: [iOS]

    outputs:
      OUTPUT_DATE:            ${{ steps.build.outputs.OUTPUT_DATE }}
      SDL_COMMIT:             ${{ steps.build.outputs.SDL_COMMIT }}
      SDL_IMAGE_COMMIT:       ${{ steps.build.outputs.SDL_IMAGE_COMMIT }}
      SDL_MIXER_COMMIT:       ${{ steps.build.outputs.SDL_MIXER_COMMIT }}
      SDL_TTF_COMMIT:         ${{ steps.build.outputs.SDL_TTF_COMMIT }}
      FFMPEG_COMMIT:          ${{ steps.build.outputs.FFMPEG_COMMIT }}
      IMGUI_COMMIT:           ${{ steps.build.outputs.IMGUI_COMMIT }}
      CLAY_COMMIT:            ${{ steps.build.outputs.CLAY_COMMIT }}
#      SDL_RTF_COMMIT:         ${{ steps.build.outputs.SDL_RTF_COMMIT }}
#      SDL_NET_COMMIT:         ${{ steps.build.outputs.SDL_NET_COMMIT }}
#      SDL_SOUND_COMMIT:       ${{ steps.build.outputs.SDL_SOUND_COMMIT }}
#      SDL_SHADERCROSS_COMMIT: ${{ steps.build.outputs.SDL_SHADERCROSS_COMMIT }}
#      SDL2_COMPAT_COMMIT:     ${{ steps.build.outputs.SDL2_COMPAT_COMMIT }}

    steps:

      - name: checkout
        uses: actions/checkout@v6

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
            xcode-version: "16.0.0"

      - name: Download iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-sdk"
          curl -fL --retry 3 "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$RUNNER_TEMP/ios-sdk"
          echo "IOS_SDKROOT=$RUNNER_TEMP/ios-sdk/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"
          echo "IOS_SDK_VERSION=16.5" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"

      - name: build
        id: build
        run: bash build.sh ${{ matrix.platform }}

      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: libraries-${{ matrix.platform }}-${{ steps.build.outputs.OUTPUT_DATE }}
          path: artifacts/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:

      - name: create or update release
        run: |
          echo '[SDL commit](https://github.com/libsdl-org/SDL/commit/${{ needs.build.outputs.SDL_COMMIT }})'                                     >>notes.txt
          echo '[SDL_image commit](https://github.com/libsdl-org/SDL_image/commit/${{ needs.build.outputs.SDL_IMAGE_COMMIT }})'                   >>notes.txt
          echo '[SDL_mixer commit](https://github.com/libsdl-org/SDL_mixer/commit/${{ needs.build.outputs.SDL_MIXER_COMMIT }})'                   >>notes.txt
          echo '[SDL_ttf commit](https://github.com/libsdl-org/SDL_ttf/commit/${{ needs.build.outputs.SDL_TTF_COMMIT }})'                         >>notes.txt
          echo '[FFmpeg commit](https://github.com/FFmpeg/FFmpeg/commit/${{ needs.build.outputs.FFMPEG_COMMIT }})'                                >>notes.txt
          echo '[ImGui commit](https://github.com/ocornut/imgui/commit/${{ needs.build.outputs.IMGUI_COMMIT }})'                                  >>notes.txt
          echo '[Clay commit](https://github.com/nicbarker/clay/commit/${{ needs.build.outputs.CLAY_COMMIT }})'                                   >>notes.txt

          if gh release view ${{ needs.build.outputs.OUTPUT_DATE }} -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit ${{ needs.build.outputs.OUTPUT_DATE }} -R "${GITHUB_REPOSITORY}" -t '${{ needs.build.outputs.OUTPUT_DATE }}' -F notes.txt
          else
            gh release create ${{ needs.build.outputs.OUTPUT_DATE }} -R "${GITHUB_REPOSITORY}" -t '${{ needs.build.outputs.OUTPUT_DATE }}' -F notes.txt
          fi
#          echo '[SDL_rtf commit](https://github.com/libsdl-org/SDL_rtf/commit/${{ needs.build.outputs.SDL_RTF_COMMIT }})'                         >>notes.txt
#          echo '[SDL_net commit](https://github.com/libsdl-org/SDL_net/commit/${{ needs.build.outputs.SDL_NET_COMMIT }})'                         >>notes.txt
#          echo '[SDL_sound commit](https://github.com/icculus/SDL_sound/commit/${{ needs.build.outputs.SDL_SOUND_COMMIT }})'                      >>notes.txt
#          echo '[SDL_shadercross commit](https://github.com/libsdl-org/SDL_shadercross/commit/${{ needs.build.outputs.SDL_SHADERCROSS_COMMIT }})' >>notes.txt
#          echo '[SDL2_compat commit](https://github.com/libsdl-org/sdl2-compat/commit/${{ needs.build.outputs.SDL2_COMPAT_COMMIT }})'             >>notes.txt

      - name: get artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: libraries-*-${{ needs.build.outputs.OUTPUT_DATE }}
          merge-multiple: true

      - name: upload artifacts
        run: gh release upload '${{ needs.build.outputs.OUTPUT_DATE }}' *.zip -R "${GITHUB_REPOSITORY}" --clobber
